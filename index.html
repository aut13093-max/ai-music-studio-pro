<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>AI MUSIC STUDIO PRO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#eef2ff;font-family:Arial,sans-serif;padding:18px}
main{max-width:760px;margin:auto}
h1{color:#a5b4fc}
.card{background:#151e33;padding:18px;border-radius:14px;margin:14px 0;border:1px solid #2a3855}
label{display:block;margin:14px 0 7px}
input,select,textarea,button{width:100%;padding:12px;border-radius:8px;border:1px solid #344563;background:#0c1528;color:white;font-size:16px}
textarea{min-height:180px;resize:vertical;line-height:1.7}
button{background:#6256e8;border:0;margin-top:12px;font-weight:bold;cursor:pointer}
button.secondary{background:#273650}
button:disabled{opacity:.6;cursor:wait}
.small{color:#a8b6d0;font-size:13px;line-height:1.6}
.status{margin-top:12px;line-height:1.6;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>AI MUSIC STUDIO PRO</h1>
<p>多语言智能歌曲创作工作室</p>

<div class="card">
<label>创作语言 / Ngôn ngữ</label>
<select id="lang">
<option value="zh">中文</option>
<option value="vi">Tiếng Việt</option>
<option value="mix">中越双语 / Trung-Việt</option>
<option value="en">English</option>
</select>

<label>歌曲主题 / Chủ đề</label>
<input id="theme" maxlength="200" placeholder="例如：人生、自然、爱情、梦想">

<label>音乐风格 / Phong cách</label>
<select id="style">
<option>高级流行</option>
<option>V-Pop</option>
<option>电影交响乐</option>
<option>中国风</option>
<option>摇滚</option>
<option>电子音乐</option>
<option>说唱</option>
<option>民谣</option>
<option>爵士</option>
</select>

<label>演唱方式</label>
<select id="voice">
<option>男声</option>
<option>女声</option>
<option>男女对唱</option>
<option>大合唱</option>
<option>纯音乐</option>
</select>

<label>歌曲长度</label>
<select id="duration">
<option>15秒短视频</option>
<option>30秒短歌</option>
<option>1分钟歌曲</option>
<option selected>3分钟完整歌曲</option>
</select>

<button id="generateBtn" onclick="createSong()">✨ AI 生成歌曲方案</button>
<button class="secondary" onclick="saveSong()">保存作品</button>
<button class="secondary" onclick="showSaved()">查看已保存作品</button>
<div id="status" class="status small" role="status"></div>
</div>

<div class="card">
<h3>AI 歌词创作 / Lời bài hát</h3>
<textarea id="lyrics" placeholder="AI 生成的歌词会显示在这里"></textarea>
<button onclick="copyText('lyrics')">复制歌词</button>
</div>

<div class="card">
<h3>AI 音乐生成提示词</h3>
<textarea id="prompt" placeholder="AI 音乐风格、节奏、人声和编曲方案"></textarea>
<button onclick="copyText('prompt')">复制音乐提示词</button>
<p class="small">将提示词复制到支持 AI 音乐生成的平台（如 Suno / Udio），即可尝试制作音频。</p>
</div>

<div class="card">
<h3>我的作品</h3>
<div id="saved" class="small">作品保存在当前浏览器中。</div>
</div>
</main>

<script>
const $ = id => document.getElementById(id);

async function createSong(){
  const theme = $('theme').value.trim();
  if(!theme){
    alert('请先输入歌曲主题');
    return;
  }

  const btn = $('generateBtn');
  const status = $('status');

  btn.disabled = true;
  btn.textContent = 'AI 正在创作，请稍候…';
  status.textContent = '正在连接 AI 歌词服务，请不要关闭页面。';

  const lang = $('lang').value;
  const style = $('style').value;
  const voice = $('voice').value;
  const duration = $('duration').value;

  try {
    const response = await fetch('/api/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        theme,
        lang: lang === 'mix' ? 'zhvi' : lang,
        style,
        voice,
        duration
      })
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || 'AI 请求失败，请稍后重试。');
    }

    if(!data.lyrics){
      throw new Error('AI 没有返回歌词，请重新尝试。');
    }

    // 直接使用后端独立解析好的字段
    $('lyrics').value = data.lyrics.trim();
    $('prompt').value = (data.prompt || '').trim();

    status.textContent = 'AI 歌词生成成功！可以复制、保存或继续编辑。';

  } catch(error) {
    console.error('AI generation error:', error);
    status.textContent = '生成失败：' + error.message + '。请检查后端部署及环境变量。';
  } finally {
    btn.disabled = false;
    btn.textContent = '✨ AI 生成歌曲方案';
  }
}

async function copyText(id){
  const field = $(id);

  if(!field.value.trim()){
    alert('没有可复制的内容');
    return;
  }

  try {
    await navigator.clipboard.writeText(field.value);
    alert('复制成功');
  } catch(e) {
    field.focus();
    field.select();
    alert('请长按选中文字并复制');
  }
}

function saveSong(){
  const title = $('theme').value.trim();

  if(!title){
    alert('请先输入歌曲主题');
    return;
  }

  if(!$('lyrics').value.trim() && !$('prompt').value.trim()){
    alert('请先生成歌曲方案');
    return;
  }

  try {
    const list = JSON.parse(localStorage.getItem('aiSongs') || '[]');

    list.unshift({
      title,
      date: new Date().toLocaleString(),
      lang: $('lang').value,
      style: $('style').value,
      voice: $('voice').value,
      duration: $('duration').value,
      lyrics: $('lyrics').value,
      prompt: $('prompt').value
    });

    localStorage.setItem('aiSongs', JSON.stringify(list.slice(0,100)));
    alert('作品已保存在当前浏览器');
    showSaved();
  } catch(e) {
    alert('保存失败，可能是浏览器存储空间不足。');
  }
}

function showSaved(){
  const box = $('saved');
  box.replaceChildren();

  let list;

  try {
    list = JSON.parse(localStorage.getItem('aiSongs') || '[]');
  } catch(e) {
    list = [];
  }

  if(!list.length){
    box.textContent = '暂时没有保存的作品';
    return;
  }

  list.forEach(song => {
    const item = document.createElement('div');
    item.className = 'card';

    const title = document.createElement('strong');
    title.textContent = (song.title || '未命名') + ' — ' + (song.date || '');

    const loadBtn = document.createElement('button');
    loadBtn.className = 'secondary';
    loadBtn.textContent = '载入作品';

    loadBtn.onclick = () => {
      $('theme').value = song.title || '';
      $('lang').value = song.lang || 'zh';
      $('style').value = song.style || '高级流行';
      $('voice').value = song.voice || '男声';
      $('duration').value = song.duration || '3分钟完整歌曲';
      $('lyrics').value = song.lyrics || '';
      $('prompt').value = song.prompt || '';
      $('status').textContent = '已载入作品，可以继续编辑。';
      window.scrollTo({top:0,behavior:'smooth'});
    };

    item.append(title, loadBtn);
    box.append(item);
  });
}

showSaved();
</script>
</body>
</html>
